name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libportaudio2
      - run: python -m pip install -e '.[dev]' build
      - run: ruff check src tests
      - run: pytest -q
      - run: python -m build
      - run: python tools/build_linux_installer.py
      - run: dist/linux/voxd-linux.run --help
