name: Windows terminal installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - shell: pwsh
        run: ./packaging/windows/build.ps1
      - shell: pwsh
        run: |
          & dist/windows/voxd-terminal-setup-x64.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Terminal launcher smoke failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: voxd-windows-terminal
          path: |
            dist/windows/voxd-terminal-setup-x64.exe
            dist/windows/voxd-terminal-installer.zip
